services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chonguon
      POSTGRES_USER: chonguon
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - chonguon_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chonguon -d chonguon"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  chonguon_data:
